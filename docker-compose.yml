services:
  web:
    build: ./web
    env_file:
      - .env
    container_name: smart_ticket_web
    restart: unless-stopped

    environment:
      FLASK_ENV: development

      # Database - SQLite
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      SQLITE_PATH: ${SQLITE_PATH:-/app/data/ticketdb.sqlite3}

      # Flask
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}

      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      HEALTH_AI_ENABLED: ${HEALTH_AI_ENABLED:-false}
      HEALTH_AI_QUESTION_COUNT: ${HEALTH_AI_QUESTION_COUNT:-5}

      # Email notification
      NOTIFY_EMAIL_ENABLED: ${NOTIFY_EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}

      # Extra aliases in case your Python code uses these names
      SMTP_USER: ${SMTP_USERNAME:-}
      SMTP_FROM: ${SMTP_FROM_EMAIL:-}

      # Telegram notification
      NOTIFY_TELEGRAM_ENABLED: ${NOTIFY_TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

    volumes:
      - uploads:/app/uploads
      - sqlite_data:/app/data

    ports:
      - "8080:8080"

volumes:
  uploads:
  sqlite_data: