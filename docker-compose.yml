services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: smart_ticket_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticketdb}
      MYSQL_USER: ${MYSQL_USER:-ticketuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ticketpass}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  web:
    build: ./web
    env_file: .env
    container_name: smart_ticket_web
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-ticketdb}
      DB_USER: ${MYSQL_USER:-ticketuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ticketpass}

      # Optional AI triage
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      - db
      - adminer

  adminer:
    image: adminer:4
    container_name: smart_ticket_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data:
  uploads:
