{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Edit Technician</h1>
  <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('admin_technicians') }}">Back</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" value="{{ tech.name }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" value="{{ tech.email }}" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Skill Group</label>
        <select class="form-select" name="skill_group">
          {% for s in ["Network","Hardware","Software","Printer","General"] %}
            <option value="{{ s }}" {% if tech.skill_group==s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Availability</label>
        <select class="form-select" name="availability">
          {% for s in ["Available","Busy","Off"] %}
            <option value="{{ s }}" {% if tech.availability==s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Active</label>
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" name="is_active" id="isActive" {% if tech.is_active %}checked{% endif %}>
          <label class="form-check-label" for="isActive">Account enabled</label>
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label">Reset Password (optional)</label>
        <input class="form-control" name="password" placeholder="Leave blank to keep current">
      </div>
      <div class="col-md-6">
        <label class="form-label">Telegram Chat ID</label>
        <input class="form-control" name="telegram_chat_id" value="{{ tech.telegram_chat_id or '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Notification Preference</label>
        <select class="form-select" name="notification_preference">
          {% for preference in notification_preferences %}
            <option value="{{ preference }}" {% if tech.notification_preference == preference %}selected{% endif %}>
              {{ preference }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
